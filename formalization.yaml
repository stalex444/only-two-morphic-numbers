fidelity:
  divergences: >-
    STATEMENT fidelity is exact: the definition is transcribed from
    p. 57 of the paper (p + 1 = p^k and p - 1 = p^(-l), the second
    equation rendered zpow-free as p^l * (p - 1) = 1; the conjuncts
    0 < k and 0 < l transcribe "natural numbers", and are removable — k = 0 would
    force 1 = p + 1, against 1 < p, and l = 0 would force p = 2,
    killed by 2^k = 3; p > 1 sits inside the
    morphic property, so the compared iff is unconditional in p. The
    plastic number enters the compared statements hypothesis-style
    (1 < rho and rho^3 = rho + 1) and is reconciled to the proof
    module's constructed constant by its uniqueness lemma. One
    PROOF-ROUTE divergence, with identical statement: the paper's
    Lemma derives the cofactor from Tverberg's theorem and an analysis
    of complex zeros of modulus 1 (a modulus-1 zero of
    x^m - x^(m-1) - 1 has distance 1 from both 0 and 1, forcing a
    primitive sixth root of unity, hence divisibility by
    x^2 - x + 1). The formal proof replaces both the citation and the
    complex analysis: the mirror dichotomy (extracted from Mathlib's
    Ljunggren machinery) forces the cofactor q to be mirror-fixed, and
    the rest runs wholly in Z[X] — q divides both the trinomial B and
    its mirror, hence q divides X * (X^j + 1); q's constant
    coefficient is a unit, so an explicit Bezout pair makes q coprime
    to X, giving q | X^j + 1; then q divides
    (X - 1) * X * (X^j + 1) - B = X^2 - X + 1. This is a
    simplification, not a weakening. The two points the paper leaves
    implicit — that Tverberg's all-modulus-1 factor is a priori a
    POWER of x^2 - x + 1, and the separability needed to reduce that
    power to one — do not arise on this route and are discharged
    explicitly: the cofactor is proved to divide the quadratic
    outright, and a monic divisor of x^2 - x + 1 is 1 or the quadratic
    itself (a linear divisor is killed by a^2 + a + 1 != 0 over the
    integers).

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Statements audited by the author against the source paper (read in
    full from the journal's open-access PDF); the kernel and the axiom
    audit are the acceptance criteria. An in-house adversarial scoping
    pass, automated (AI-assisted: Anthropic Claude, in Claude Code,
    under the author's direction), was applied before the build,
    2026-09-01: independent source-extraction and prior-art probes, a
    hands-on Lean feasibility probe (three compiled probe files
    against the pinned Mathlib), and an adversarial judge whose
    recommended statement set — the full iff as the load-bearing
    statement, the witnesses admitted only as labeled-routine
    readability surface — is the set implemented here.

alignment:
  namespace: "MorphicNumbers"
  statements:
    - source: "Aarts-Fokkink-Kruijtzer 2001, Theorem (p. 58): there exist only two morphic numbers, the divine proportion and the plastic number"
      lean: "MorphicNumbers.morphic_iff"
      module: "Solution"
      status: "proved"
      note: >-
        The full classification as an unconditional iff in p, with rho
        pinned hypothesis-style; forward direction the negative half,
        reverse direction both witnesses.
    - source: "Aarts-Fokkink-Kruijtzer 2001, p. 57 (the divine proportion's scale identities 1 + phi = phi^2 and phi - 1 = 1/phi)"
      lean: "MorphicNumbers.goldenRatio_morphic"
      module: "Solution"
      status: "proved"
      note: >-
        Witness corollary, (k, l) = (2, 1). Explicitly a routine
        consequence of Real.goldenRatio_sq; readability surface.
    - source: "Aarts-Fokkink-Kruijtzer 2001, p. 57 (the plastic number's identities, via x^5 - x^4 - 1 = (x^3 - x - 1)(x^2 - x + 1))"
      lean: "MorphicNumbers.plasticNumber_morphic"
      module: "Solution"
      status: "proved"
      note: >-
        Witness corollary, (k, l) = (3, 4), by the paper's own
        displayed identity applied at rho. Explicitly a routine
        consequence of the defining cubic; readability surface.

    - source: "Aarts-Fokkink-Kruijtzer 2001 (existence side of the Theorem, p. 58; the root's existence by the intermediate value theorem)"
      lean: "MorphicNumbers.plastic_exists"
      module: "Solution"
      status: "proved"
      note: >-
        A real x > 1 with x^3 = x + 1 exists — the existence half of
        "there exist only two morphic numbers"; with morphic_iff and
        the witnesses, the compared surface carries the full
        existence-and-uniqueness classification.

