related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4 (Mathlib/NumberTheory/Real/GoldenRatio.lean; Mathlib/RingTheory/Polynomial/Selmer.lean; Mathlib/Algebra/Polynomial/UnitTrinomial.lean)"
    relationship: "builds-on"
    note: >-
      Honest accounting of what is consumed: Real.goldenRatio and
      goldenRatio_sq from the GoldenRatio file; SELMER'S THEOREM ITSELF
      (Polynomial.X_pow_sub_X_sub_one_irreducible, Thomas Browning) —
      the heavier of AFK's two literature inputs is Mathlib's, not this
      entry's; and the Ljunggren unit-trinomial machinery (trinomial,
      mirror, isUnitTrinomial_iff'', irreducible_aux3 — a public if
      aux-named lemma), from whose irreducible_of_coprime proof body
      the mirror dichotomy is extracted. Mathlib contains no morphic
      characterization, no plastic number, and no Padovan/Perrin
      material (checked at the pin fabf563a and at master); the
      definition, the plastic number with its uniqueness, the cofactor
      analysis, and the classification are this entry's contribution.
      The extracted dichotomy is a candidate contribution under that file's generic "Develop more theory" TODO.lean — a
      candidate upstream byproduct.
  - id: "https://github.com/stalex444/pdt-lean (parent development; pinned reference revision: commit d66ffbe813e48636aa636ffcd80070b81cbf10da)"
    relationship: "other"
    note: >-
      The broader public project this entry belongs to. This repository
      is the complete, self-contained proof development for the
      compared statements, not a wrapper: the proof module PdtMorphic
      builds here with the pinned toolchain and no imports from the
      parent, and it is NATIVE to this repository — it appears in no
      other development at the pinned revision. The parent development
      shares the plastic-number conventions (rho via rho^3 = rho + 1).
  - id: "Registered entry PALOMAR-2026-08-31-000004 (stalex444/mahler-measure-minima, registered revision ca3df22)"
    relationship: "other"
    note: >-
      The registered sibling entry, by the same author: for each degree
      d in {2, 3, 4}, x^d - x - 1 attains the minimal Mahler measure
      among monic irreducible integer polynomials of degree d with
      measure above one. Complementarity, not duplication: the sibling
      characterizes x^2 - x - 1 and x^3 - x - 1 by EXTREMALITY (the
      Smyth/Mossinghoff lineage); this entry characterizes their roots
      phi and rho by the FUNCTIONAL EQUATIONS p + 1 = p^k and
      p - 1 = p^(-l) (the van der Laan/AFK lineage). Different
      literature, different audiences, zero shared statements — two
      independent theorems landing on the same pair of numbers from
      opposite sides.

status:
  scope: >-
    Formalized, 4 compared theorems, hypotheses inline. (1) morphic_iff
    — THE theorem, the full AFK classification as an unconditional iff
    in p: the inline morphic property holds iff p = Real.goldenRatio or
    p = rho, with rho pinned hypothesis-style (1 < rho,
    rho^3 = rho + 1); the forward direction is the negative half
    (Selmer minimal polynomial, mirror dichotomy, cofactor divides
    X^2 - X + 1, forced factorizations pinning (k, l) = (2, 1) or
    (3, 4)), the reverse direction carries both witnesses; existence of the cubic's root is compared separately (plastic_exists). (2)
    goldenRatio_morphic and (3) plasticNumber_morphic — the two
    witnesses as separate compared corollaries, explicitly labeled
    routine consequences (readability surface, never headlines).
    NOT formalized: nothing — the classification is proved in full,
    with no step cited in place of proof; the one proof-route
    divergence from the paper (the cofactor analysis in Z[X] instead
    of complex modulus-1 zeros) changes no statement and is disclosed
    in the fidelity block. No physical claim is part of the compared
    statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output (terminal, in-build,
  # in Solution.lean) is exactly [propext, Classical.choice,
  # Quot.sound].

